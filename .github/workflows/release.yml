name: Publish release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Validate numeric release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
      - name: Run full test suite
        run: uv run --extra test pytest -q
      - name: Build tag-derived packages
        run: uv build
      - name: Smoke test installed wheel
        shell: bash
        run: |
          wheel_env=/tmp/metering-wheel-check
          valid_output=$(mktemp)
          invalid_output=$(mktemp)
          invalid_error=$(mktemp)
          uv venv --python 3.11 "$wheel_env"
          uv pip install --python "$wheel_env/bin/python" dist/*.whl
          printf '%s\n' '{"measure":"entropy","probabilities":[0.5,0.5]}' \
            | "$wheel_env/bin/metering" >"$valid_output"
          "$wheel_env/bin/python" -c \
            'import json,sys; assert json.load(open(sys.argv[1]))["value"] == 1.0' \
            "$valid_output"
          "$wheel_env/bin/metering" --version
          set +e
          printf '%s\n' '{"measure":"entropy","probabilities":[2]}' \
            | "$wheel_env/bin/metering" >"$invalid_output" 2>"$invalid_error"
          invalid_status=$?
          set -e
          test "$invalid_status" -eq 2
          test ! -s "$invalid_output"
          "$wheel_env/bin/python" -m json.tool "$invalid_error" >/dev/null
      - name: Verify package version matches tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run python - <<'PY'
          import email
          import os
          from pathlib import Path
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              metadata_name = next(
                  name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
              )
              metadata = email.message_from_bytes(archive.read(metadata_name))
          assert metadata["Version"] == os.environ["RELEASE_TAG"]
          PY
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
